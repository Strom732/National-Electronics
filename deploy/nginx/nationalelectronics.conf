# Nginx site config for nationalelectronics.org
#
# Install:
#   sudo cp deploy/nginx/nationalelectronics.conf /etc/nginx/sites-available/nationalelectronics
#   sudo ln -s /etc/nginx/sites-available/nationalelectronics /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue a real cert with certbot instead of hand-writing the ssl_certificate
# lines below, e.g.: sudo certbot --nginx -d nationalelectronics.org -d www.nationalelectronics.org

server {
    listen 80;
    server_name nationalelectronics.org www.nationalelectronics.org;

    # Redirect all plain HTTP to HTTPS. Django's SECURE_SSL_REDIRECT also
    # does this at the app level, but handling it here avoids an
    # unnecessary round trip through Gunicorn.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nationalelectronics.org www.nationalelectronics.org;

    # ssl_certificate     /etc/letsencrypt/live/nationalelectronics.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nationalelectronics.org/privkey.pem;

    client_max_body_size 20M;  # allow product/service-request image uploads

    location /static/ {
        alias /var/www/nationalelectronics/staticfiles/;
    }

    location /media/ {
        alias /var/www/nationalelectronics/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
